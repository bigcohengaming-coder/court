services:
  - type: web
    name: petty-court
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: a long secret (16+ letters, numbers, - or _). Your admin link is https://<your-site>/#admin.<this secret>
      - key: ADMIN_KEY
        sync: false
      # Optional: turns on the AI judge. Paste your Anthropic API key in Render's dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: a TURN relay so voice works on strict networks (some mobile data, office Wi-Fi).
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
